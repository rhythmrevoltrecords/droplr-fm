# Free dependency updates. Dependabot opens a PR when a package this app depends
# on ships a security fix, so known holes don't sit in the build for months.
#
# Major-version bumps for the packages the app is actually built on are ignored
# below. Those are migrations, not updates: Next 16, Prisma 7 and TypeScript 7
# each need a deliberate afternoon, not a merge button on a release week. The
# ignore rules apply to ROUTINE version updates only — Dependabot security
# updates come through a separate channel and are never suppressed by them.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Brisbane
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps instead of twenty; security fixes still come through.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The framework and the ORM: upgraded on purpose, never on a Monday morning.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/adapter-pg"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Action bumps are low risk and always verified by the suite: one PR for all of them.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
